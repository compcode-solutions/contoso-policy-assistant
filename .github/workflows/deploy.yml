# .github/workflows/deploy.yml
# Standard push-to-deploy for Contoso Policy Assistant on the Contabo VPS.
#
# Repo secrets required:
#   DEPLOY_HOST  - VPS hostname or IP
#   DEPLOY_USER  - ssh user (root)
#   DEPLOY_KEY   - private key pinned to /opt/apps/deploy-dispatch.sh

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: contoso
  HEALTH_URL: https://api.policy.compcodesolutions.com/health

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore, build, test
        run: |
          dotnet restore Contoso.PolicyAssistant.sln
          dotnet build Contoso.PolicyAssistant.sln --configuration Release --no-restore
          dotnet test Contoso.PolicyAssistant.sln --configuration Release --no-build --verbosity minimal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web build
        working-directory: web
        run: npm ci && npm run build

  deploy:
    name: Deploy
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger deploy
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "$APP_NAME"

      - name: Wait for health
        run: |
          sleep 20
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && { echo "healthy"; exit 0; }
            sleep 15
          done
          echo "::error::$APP_NAME did not return 200 at $HEALTH_URL after ~2.5 min"
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
