name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: API test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Contoso.PolicyAssistant.sln

      - name: Build
        run: dotnet build Contoso.PolicyAssistant.sln --configuration Release --no-restore

      - name: Test (incl. golden evals)
        run: dotnet test Contoso.PolicyAssistant.sln --configuration Release --no-build --verbosity minimal

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t contoso-policy-assistant-api:ci .
